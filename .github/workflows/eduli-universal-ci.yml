name: Eduli Universal CI

on:
  push:
    branches: [main]
    paths:
      - "apps/eduli/**"
      - ".github/workflows/eduli-universal-ci.yml"
  pull_request:
    paths:
      - "apps/eduli/**"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/eduli

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/eduli/package.json

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Export web
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
          EXPO_PUBLIC_APP_URL: https://example.com
        run: npx expo export --platform web

      - name: Smoke test exported web server
        env:
          PORT: 4173
        run: |
          npm run serve:web > /tmp/eduli-serve.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT

          for attempt in $(seq 1 20); do
            if curl --fail --silent "http://127.0.0.1:$PORT/" > /dev/null; then
              exit 0
            fi
            sleep 1
          done

          cat /tmp/eduli-serve.log
          exit 1

      - name: Export Android bundle
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
          EXPO_PUBLIC_APP_URL: https://example.com
        run: npx expo export --platform android --output-dir dist-android

      - name: Export iOS bundle
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
          EXPO_PUBLIC_APP_URL: https://example.com
        run: npx expo export --platform ios --output-dir dist-ios
